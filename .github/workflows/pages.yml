name: Build and deploy AICraft
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - name: Test Rust pixel processing
        run: cargo +1.95.0 test --locked --manifest-path rust/Cargo.toml
      - name: Build Rust WebAssembly
        run: |
          cargo +1.95.0 build --locked --manifest-path rust/Cargo.toml --release --target wasm32-unknown-unknown
          cargo +1.95.0 install wasm-bindgen-cli --version 0.2.104 --locked
          wasm-bindgen rust/target/wasm32-unknown-unknown/release/aicraft_photo.wasm --target web --out-dir AITest/wwwroot/wasm --out-name aicraft_photo
      - name: Test compiled WebAssembly
        run: node scripts/test-wasm.mjs
      - name: Collect dependency licenses
        run: python3 scripts/collect-licenses.py
      - name: Publish Blazor
        run: |
          dotnet publish AITest/AITest.csproj -c Release -o publish
          python3 scripts/prepare-pages.py publish/wwwroot /AICraft/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

